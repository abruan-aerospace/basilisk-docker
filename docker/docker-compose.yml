# Fixed project name; otherwise Compose names it after this folder ("docker").
name: Basilisk_GNC

services:
  bsk:
    container_name: basilisk_gnc
    image: bsk_img
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app/workspace
    environment:
      PYTHONPATH: /app/basilisk/dist3
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ..                     # repo root
        target: /app/workspace
    tty: true
    stdin_open: true