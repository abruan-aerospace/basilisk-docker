
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and Configuration Checks
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck ./docker/build-basilisk.sh

      - name: Validate docker-compose
        working-directory: docker
        run: docker compose config

  docker-smoke-test:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: basilisk-smoke-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DEPS=pinned

      - name: Run Basilisk standard example
        run: |
          docker run --rm \
            -e MPLBACKEND=Agg \
            basilisk-smoke-test:latest \
            python /app/basilisk/examples/scenarioBasicOrbit.py
